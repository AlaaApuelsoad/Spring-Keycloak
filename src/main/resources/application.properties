spring.application.name=Keycloak
server.port=8081
server.servlet.context-path=/api/v1


# -------------------------------
# JWT (Keycloak) Security Configuration
# -------------------------------

# The issuer URI for the JWT tokens, pointing to your Keycloak realm.
# This URI is used to validate the issuer of incoming tokens.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/Alaa

# URI to retrieve the JSON Web Key Set (JWKS) used to verify the JWT signature.
# This is typically derived from the issuer URI.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

# -------------------------------
# Custom JWT Converter Configuration
# -------------------------------

# The resource ID (client ID) as registered in Keycloak.
# Used to extract specific roles from the "resource_access" claim in the JWT.
jwt.auth.converter.resource-id=alaa-rest-api

# The claim to be used as the principal name (e.g., username).
# Common values are 'preferred_username' or 'sub'.
jwt.auth.principle-attribute=preferred_username